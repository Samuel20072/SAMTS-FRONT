<section id="cta" style="padding: 5rem 0; background: #ffffff;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 2rem;">
    
    <!-- CTA Container -->
    <div style="position: relative; overflow: hidden; border-radius: 2rem; padding: 3.5rem 3rem; display: flex; align-items: center; justify-content: space-between; gap: 3rem; background: var(--color-gray-50); border: 1px solid var(--color-gray-200); box-shadow: 0 10px 40px rgba(0,0,0,0.03);" class="samts-cta-box">
      
      <!-- Decorative blob -->
      <div style="position: absolute; right: -4rem; top: -4rem; width: 16rem; height: 16rem; border-radius: 50%; pointer-events: none; opacity: 0.2; background-color: var(--color-violet); filter: blur(80px);"></div>

      <!-- Text Side (Left Column) -->
      <div style="position: relative; z-index: 10; max-width: 580px; text-align: left; display: flex; flex-direction: column; gap: 0.75rem;">
        <!-- Badge -->
        <span style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-violet); font-family: var(--font-body);">
          EMPIEZA HOY
        </span>
        
        <!-- Header -->
        <h3 style="font-family: var(--font-display); font-size: clamp(1.75rem, 3.5vw, 2.35rem); font-weight: 800; color: var(--color-black); letter-spacing: -0.02em; line-height: 1.15; margin: 0;">
          ¿Listo para tener una página que trabaja por ti?
        </h3>
        
        <!-- Description -->
        <p style="font-family: var(--font-body); color: var(--color-gray-600); font-size: 0.95rem; line-height: 1.65; margin: 0;">
          Creamos tu sitio, conectamos la IA a tu negocio y en 2 semanas tienes un sistema que genera contenido y clientes solo.
        </p>
      </div>

      <!-- Button Side (Right Column) -->
      <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.85rem; flex-shrink: 0;">
        <!-- Spots Left Badge -->
        <div style="display: inline-flex; align-items: center; gap: 8px; border-radius: 9999px; padding: 6px 14px; font-size: 0.75rem; font-weight: 600; color: #059669; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);">
          <span style="width: 6px; height: 6px; border-radius: 50%; background-color: #10b981; display: inline-block;"></span>
          <span>3 lugares disponibles este mes</span>
        </div>

        <!-- Consultation Button -->
        <button 
          (click)="openConsultation()" 
          class="samts-btn samts-btn--primary samts-btn--lg" style="width: 100%; text-align: center; justify-content: center;">
          Agenda tu consulta gratis
        </button>

        <!-- Subtext -->
        <span style="font-size: 0.75rem; color: var(--color-gray-500); font-family: var(--font-body); text-align: center;">
          Sin compromiso · 15 minutos · por videollamada
        </span>
      </div>
    </div>

  </div>
</section>
