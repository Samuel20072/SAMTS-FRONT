<section id="cta-final" class="cta-section">

  <!-- Detalles gráficos decorativos -->
  <div class="cta-deco cta-ring cta-ring--1" aria-hidden="true"></div>
  <div class="cta-deco cta-ring cta-ring--2" aria-hidden="true"></div>
  <div class="cta-deco cta-dots" aria-hidden="true"></div>
  <div class="cta-deco cta-glow" aria-hidden="true"></div>

  <div class="cta-container">
    <div class="cta-inner" samtsAnimate="fade-up" animDelay="0ms">

      <span class="cta-eyebrow">
        <i class="pi pi-sparkles"></i>
        <span>Siguiente paso</span>
      </span>

      <h2 class="cta-title">
        Tu próximo proyecto <span class="cta-highlight">empieza aquí.</span>
      </h2>

      <p class="cta-desc">
        Cuéntanos qué necesita tu negocio. Encontremos juntos una solución que realmente te ayude a crecer.
      </p>

      <div class="cta-actions">
        <button
          type="button"
          class="cta-btn-primary"
          (click)="startProject()">
          <i class="pi pi-arrow-right"></i>
          <span>Empezar mi proyecto</span>
        </button>

        <a
          class="cta-btn-ghost"
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener">
          <i class="pi pi-comments"></i>
          <span>Hablar con SAMTS</span>
        </a>
      </div>

    </div>
  </div>
</section>
