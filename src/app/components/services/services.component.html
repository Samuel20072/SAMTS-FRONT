<section id="services" style="position: relative; padding: 7rem 0; background: #ffffff; overflow: hidden;">

  <div style="position: relative; z-index: 10; margin: 0 auto; max-width: 1200px; padding: 0 2rem;">
    
    <!-- Section Header — CENTRADO -->
    <div style="max-width: 720px; margin: 0 auto 4rem auto; text-align: center;">

      <!-- Badge -->
      <div style="display: inline-flex; align-items: center; gap: 8px; color: var(--color-violet); font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1rem;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background-color: var(--color-violet); display: inline-block;"></span>
        <span>Nuestros Servicios</span>
      </div>

      <!-- Title -->
      <h2 style="font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; color: var(--color-black); letter-spacing: -0.02em; margin-bottom: 1rem; line-height: 1.1; text-align: center;">
        Todo lo que tu negocio necesita<br>en un solo lugar.
      </h2>

      <!-- Subtitle -->
      <p style="font-family: var(--font-body); color: var(--color-gray-600); font-size: 1.05rem; line-height: 1.7; text-align: center; max-width: 560px; margin: 0 auto;">
        Desde la página que te hace ver profesional hasta la IA que trabaja mientras duermes.
      </p>
    </div>

    <!-- Cards Grid — 2 columnas centradas -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; max-width: 960px; margin: 0 auto;">
      <div 
        *ngFor="let service of services" 
        (click)="openConsultation()"
        class="samts-service-card"
        style="position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; border-radius: 1.5rem; transition: all 0.3s ease; min-height: 280px; cursor: pointer;">
        
        <div>
          <!-- Badge if present -->
          @if (service.badge) {
            <div style="margin-bottom: 1rem;">
              <span style="display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; background: rgba(79,53,243,0.08); color: var(--color-violet); border: 1px solid rgba(79,53,243,0.2);">
                {{ service.badge }}
              </span>
            </div>
          }

          <!-- Icon -->
          <div style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; background: rgba(79,53,243,0.08); color: var(--color-violet); border: 1px solid rgba(79,53,243,0.15);">
            <i class="pi" [ngClass]="{
              'pi-sparkles': service.title === 'IA Automática',
              'pi-desktop': service.title === 'Páginas Web Premium',
              'pi-shopping-cart': service.title === 'Tiendas Online',
              'pi-rocket': service.title === 'Landing Pages'
            }" style="font-size: 0.875rem;"></i>
          </div>

          <!-- Title & Description -->
          <h3 style="font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--color-black); margin-bottom: 0.75rem;">
            {{ service.title }}
          </h3>
          <p style="font-family: var(--font-body); color: var(--color-gray-600); font-size: 0.875rem; line-height: 1.65; margin-bottom: 2rem;">
            {{ service.description }}
          </p>
        </div>

        <!-- Tags List -->
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: auto;">
          <span 
            *ngFor="let tag of service.tags"
            style="font-family: var(--font-body); color: var(--color-gray-600); background: var(--color-gray-100); border: 1px solid var(--color-gray-200); font-size: 0.625rem; padding: 0.25rem 0.625rem; border-radius: 9999px;">
            {{ tag }}
          </span>
        </div>

      </div>
    </div>

  </div>
</section>
