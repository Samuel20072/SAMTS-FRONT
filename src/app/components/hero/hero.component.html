<!-- ══════════════════════════════════════════════════════════════
     HERO — 3D interactivo con personaje animado
     ══════════════════════════════════════════════════════════════ -->
<section id="hero" class="hero-section" #heroSection>

  <!-- Canvas Three.js: fondo transparente, personaje a la izquierda -->
  <canvas #heroCanvas class="hero-canvas" aria-label="Personaje 3D SAMTS interactivo"></canvas>

  <!-- Contenido siempre visible a la derecha -->
  <div class="hero-content">
    <span class="hero-eyebrow">Soluciones Digitales Inteligentes</span>
    <h1 class="hero-heading">
      Tu negocio,<br>
      <em>automatizado.</em><br>
      Sin esfuerzo.
    </h1>
    <p class="hero-sub">
      Construimos páginas web que trabajan por ti: generan contenido, gestionan tu marca y convierten visitas en clientes, de forma automática.
    </p>

    <div class="hero-ctas">
      <button (click)="openConsultation()" class="hero-btn-primary">
        <i class="pi pi-calendar"></i>
        <span>Agendar Asesoría</span>
      </button>
      <button (click)="scrollToServices()" class="hero-btn-outline">
        <i class="pi pi-arrow-down"></i>
        <span>Ver Servicios</span>
      </button>
    </div>

    <div class="hero-stats">
      <div class="hero-stat">
        <strong>100%</strong>
        <span>Personalizado</span>
      </div>
      <div class="hero-stat-sep"></div>
      <div class="hero-stat">
        <strong>24/7</strong>
        <span>Soporte IA</span>
      </div>
      <div class="hero-stat-sep"></div>
      <div class="hero-stat">
        <strong>10x</strong>
        <span>Más rápido</span>
      </div>
    </div>
  </div>

</section>

<!-- Demo Video Dialog -->
<p-dialog
  [visible]="showDemoVideo()"
  (visibleChange)="$event ? null : closeDemo()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [style]="{ width: '90%', maxWidth: '900px' }"
  styleClass="samts-dialog"
  [showHeader]="false">
  <div class="relative p-1">
    <button (click)="closeDemo()"
      class="absolute top-4 right-4 z-20 p-2.5 rounded-full bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 transition-colors"
      aria-label="Cerrar demo">
      <i class="pi pi-times text-base"></i>
    </button>
    <div class="aspect-video bg-gray-900 flex flex-col items-center justify-center text-center relative overflow-hidden rounded-2xl">
      <h4 class="text-2xl font-bold text-white">SAMTS AI Web Engine</h4>
    </div>
  </div>
</p-dialog>
