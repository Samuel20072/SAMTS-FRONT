<!-- ══════════════════════════════════════════════════════════════
     Samuel Result — Pantalla Compacta y Elegante (Apple Style)
     ══════════════════════════════════════════════════════════════ -->

<div class="samuel-result" id="samuel-result-panel">

  <!-- ── Tarjeta Principal Compacta ──────────────────────── -->
  <div class="samuel-result__card">
    
    <!-- Top badge + precio -->
    <div class="samuel-result__card-top">
      <span class="samuel-rec-badge">
        <i class="pi pi-sparkles"></i>
        Propuesta Recomendada
      </span>
      <div class="samuel-result__price-tag">
        <span class="samuel-result__price-val">{{ recommendation.primary.price }}</span>
        <span class="samuel-result__price-sub">{{ recommendation.primary.priceNote || 'Pago único' }}</span>
      </div>
    </div>

    <!-- Título y subtítulo -->
    <h3 class="samuel-result__plan-title">{{ recommendation.primary.name }}</h3>
    <p class="samuel-result__plan-reasoning">{{ recommendation.reasoning }}</p>

    <!-- Bullets clave (máximo 3) -->
    <ul class="samuel-result__feature-list">
      @for (f of recommendation.primary.features.slice(0, 3); track f) {
        <li>
          <i class="pi pi-check"></i>
          <span>{{ f }}</span>
        </li>
      }
    </ul>

    <!-- ── Botones de Acción Estilo Frosted Pill Apple ── -->
    <div class="samuel-result__actions">
      <!-- Botón Principal: Ver Demo Interactiva (Scrolls down to full demo) -->
      <button
        type="button"
        id="samuel-btn-open-demo"
        class="samuel-frosted-btn samuel-frosted-btn--hero"
        (click)="openPreview()">
        <i class="pi pi-eye"></i>
        <span>Ver demo de mi negocio</span>
      </button>

      <!-- Botón Pedir por WhatsApp -->
      <button
        type="button"
        id="samuel-result-whatsapp"
        class="samuel-frosted-btn samuel-frosted-btn--accent"
        (click)="onWhatsApp()">
        <i class="pi pi-whatsapp"></i>
        <span>Solicitar solución</span>
      </button>
    </div>

    <!-- Botón secundario discreto de reinicio -->
    <div class="samuel-result__bottom-bar">
      <button
        type="button"
        class="samuel-result__restart-link"
        (click)="onRestart()">
        <i class="pi pi-refresh"></i>
        <span>Hacer otro diagnóstico</span>
      </button>
      <span class="samuel-result__guarantee">
        <i class="pi pi-lock"></i> Sin compromiso
      </span>
    </div>

  </div>

</div>
