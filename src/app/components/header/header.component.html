<nav class="samts-nav">
  <div class="samts-nav__inner">

    <!-- Logo -->
    <div class="samts-nav__logo" (click)="scrollToSection('hero')">
      <span class="samts-nav__logo-text">
        <span class="samts-nav__logo-bracket">[</span>SAMTS<span class="samts-nav__logo-bracket">]</span>
      </span>
    </div>

    <!-- Desktop Nav Links -->
    <div class="samts-nav__links">
      <button (click)="scrollToSection('hero')" class="samts-nav__link">Inicio</button>
      <button (click)="scrollToSection('services')" class="samts-nav__link">Servicios</button>
      <button (click)="navigateTo('/portfolio')" class="samts-nav__link">Portafolio</button>
      <button (click)="navigateTo('/pricing')" class="samts-nav__link">Precios</button>
      <button (click)="navigateTo('/guia')" class="samts-nav__link" style="display: inline-flex; align-items: center; gap: 6px;">
        <span>Guía</span>
        <span style="font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 9999px; background: rgba(37,99,235,0.12); color: #2563eb; letter-spacing: 0.04em;">GRATIS</span>
      </button>
    </div>

    <!-- Right side -->
    <div class="samts-nav__actions">
      <!-- CTA Button -->
      <button (click)="openConsultation()" class="samts-btn samts-btn--primary hidden sm:block">
        Empezar
      </button>

      <!-- Mobile Menu Toggle -->
      <button (click)="toggleMenu()" class="samts-nav__mobile-toggle inline-flex md:hidden">
        <i class="pi text-xl" [ngClass]="isMenuOpen() ? 'pi-times' : 'pi-bars'"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
    <div class="samts-nav__mobile-menu animate-fade-in">
      <button (click)="scrollToSection('hero'); toggleMenu()" class="samts-nav__mobile-link">Inicio</button>
      <button (click)="scrollToSection('services'); toggleMenu()" class="samts-nav__mobile-link">Servicios</button>
      <button (click)="navigateTo('/portfolio')" class="samts-nav__mobile-link">Portafolio</button>
      <button (click)="navigateTo('/pricing')" class="samts-nav__mobile-link">Precios</button>
      <button (click)="navigateTo('/guia')" class="samts-nav__mobile-link" style="display: flex; align-items: center; justify-content: space-between;">
        <span>Guía Gratuita</span>
        <span style="font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 9999px; background: rgba(37,99,235,0.15); color: #2563eb;">PDF</span>
      </button>
      <button (click)="openConsultation(); toggleMenu()" class="samts-btn samts-btn--primary w-full mt-3">
        Empezar
      </button>
    </div>
  }
</nav>
