<div class="samts-nav-trigger" (mouseenter)="isHoveredTop.set(true)"></div>
<nav class="samts-nav"
     [class.samts-nav--dark]="isHomePage()"
     [class.samts-nav--light]="!isHomePage()"
     [class.scrolled]="isScrolled()"
     [class.hidden-demo]="isHeaderHidden()"
     (mouseenter)="isHoveredTop.set(true)">
  <div class="samts-nav__inner">

    <!-- Logo -->
    <div class="samts-nav__logo" (click)="scrollToSection('hero')" role="button" tabindex="0" (keydown.enter)="scrollToSection('hero')" aria-label="SAMTS Inicio">
      <span class="samts-nav__logo-text">
        <span class="samts-nav__logo-bracket">[</span>SAMTS<span class="samts-nav__logo-bracket">]</span>
      </span>
    </div>

    <!-- Desktop Nav Links -->
    <div class="samts-nav__links">
      <button (click)="scrollToSection('hero')" class="samts-nav__link" [class.active]="isCurrentRoute('/')">Inicio</button>
      <button (click)="scrollToSection('services')" class="samts-nav__link">Servicios</button>
      <button (click)="navigateTo('/portfolio')" class="samts-nav__link" [class.active]="isCurrentRoute('/portfolio')">Portafolio</button>
      <button (click)="navigateTo('/pricing')" class="samts-nav__link" [class.active]="isCurrentRoute('/pricing')">Precios</button>
      <button (click)="navigateTo('/contacto')" class="samts-nav__link" [class.active]="isCurrentRoute('/contacto')">Contacto</button>
      <button (click)="navigateTo('/guia')" class="samts-nav__link samts-nav__link--badge" [class.active]="isCurrentRoute('/guia')">
        <span>Guía</span>
        <span class="samts-nav__badge-free">GRATIS</span>
      </button>
    </div>

    <!-- Right side -->
    <div class="samts-nav__actions">
      <!-- CTA Button — visible on desktop (≥768px) -->
      <button (click)="openConsultation()" class="samts-nav__cta samts-nav__cta--desktop">
        <span>Empezar</span>
        <i class="pi pi-arrow-right" style="font-size: 11px;"></i>
      </button>

      <!-- Mobile row: compact CTA + hamburger -->
      <div class="samts-nav__mobile-actions">
        <button (click)="openConsultation()" class="samts-nav__cta samts-nav__cta--mobile">
          <span>Empezar</span>
        </button>
        <button (click)="toggleMenu()" class="samts-nav__mobile-toggle" aria-label="Abrir menú">
          <i class="pi" [ngClass]="isMenuOpen() ? 'pi-times' : 'pi-bars'" style="font-size: 20px;"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
    <div class="samts-nav__mobile-menu animate-fade-in">
      <button (click)="scrollToSection('hero'); toggleMenu()" class="samts-nav__mobile-link">Inicio</button>
      <button (click)="scrollToSection('services'); toggleMenu()" class="samts-nav__mobile-link">Servicios</button>
      <button (click)="navigateTo('/portfolio')" class="samts-nav__mobile-link">Portafolio</button>
      <button (click)="navigateTo('/pricing')" class="samts-nav__mobile-link">Precios</button>
      <button (click)="navigateTo('/contacto')" class="samts-nav__mobile-link">Contacto</button>
      <button (click)="navigateTo('/guia')" class="samts-nav__mobile-link" style="display: flex; align-items: center; justify-content: space-between;">
        <span>Guía Gratuita</span>
        <span class="samts-nav__badge-free">PDF GRATIS</span>
      </button>
      <button (click)="openConsultation(); toggleMenu()" class="samts-nav__cta samts-nav__cta--mobile-full">
        <span>Empezar</span>
        <i class="pi pi-arrow-right" style="font-size: 11px;"></i>
      </button>
    </div>
  }
</nav>
