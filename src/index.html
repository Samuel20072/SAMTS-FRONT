  <style>
    /* ===== SAMTS Splash Screen — White Experience ===== */
    #samts-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', 'Outfit', sans-serif;
    }

    /* ── Soft blue glow behind the wordmark ── */
    .splash-glow {
      position: absolute;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(49,94,251,0.10) 0%, rgba(49,94,251,0.03) 42%, transparent 70%);
      animation: samts-pulse-glow 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes samts-pulse-glow {
      0%, 100% { transform: scale(1);    opacity: 0.7; }
      50%      { transform: scale(1.12); opacity: 1;   }
    }

    /* ── Wordmark ── */
    .splash-logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-wordmark {
      font-size: clamp(2.6rem, 9vw, 5.4rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      color: #111318;
      line-height: 1;
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      animation: samts-logo-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    .splash-wordmark .splash-bracket {
      color: #315EFB;
      font-weight: 900;
    }

    @keyframes samts-logo-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Tagline ── */
    .splash-tagline {
      color: #9297A1;
      font-size: clamp(0.72rem, 1.8vw, 0.9rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      margin-top: 18px;
      opacity: 0;
      transform: translateY(8px);
      animation: samts-fade-in 0.7s ease-out 0.7s forwards;
    }

    @keyframes samts-fade-in {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Morph track: thin line → capsule ── */
    .splash-morph-track {
      position: relative;
      z-index: 2;
      margin-top: 46px;
      width: clamp(200px, 30vw, 340px);
      height: 3px;
      border-radius: 999px;
      background: #F7F8FA;
      border: 1px solid #E8E9ED;
      overflow: hidden;
      opacity: 0;
      animation: samts-fade-in 0.5s ease-out 0.9s forwards;
    }

    .splash-morph-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #315EFB, #6488FE);
      border-radius: 999px;
      animation: samts-progress 1.9s cubic-bezier(0.4, 0, 0.2, 1) 1s forwards;
    }

    @keyframes samts-progress {
      0%   { width: 0%; }
      55%  { width: 70%; }
      100% { width: 100%; }
    }

    /* ── Exit animation ── */
    #samts-splash.samts-exit {
      animation: samts-exit 0.6s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes samts-exit {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.02); pointer-events: none; }
    }
  </style>
</head>
<body style="background-color: #FFFFFF;" class="font-sans antialiased selection:bg-blue-600 selection:text-white overflow-x-hidden">

  <!-- ════════════════════════════════════════════
       SAMTS SPLASH SCREEN  (removed by Angular)
       ════════════════════════════════════════════ -->
  <div id="samts-splash" aria-hidden="true">
    <div class="splash-glow"></div>

    <div class="splash-logo-wrap">
      <div class="splash-wordmark">
        <span class="splash-bracket">[</span>SAMTS<span class="splash-bracket">]</span>
      </div>
      <p class="splash-tagline">Creamos páginas que trabajan por ti</p>
    </div>

    <div class="splash-morph-track">
      <div class="splash-morph-fill"></div>
    </div>
  </div>
  <!-- ════════════════════════════════════════════ -->

  <app-root></app-root>

  <script>
    // ── Hide splash when Angular is ready ─────────────────────
    (function () {
      window.__samtsHideSplash = function () {
        var splash = document.getElementById('samts-splash');
        if (!splash) return;
        splash.classList.add('samts-exit');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 650);
      };
    })();
  </script>
</body>
</html>
